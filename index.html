<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>MajorLink — 디자인 미리보기</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { font-family: 'Pretendard', -apple-system, sans-serif; background: #FAFAFA; color: #0F172A; }
  .grid-bg {
    background-image:
      linear-gradient(to right, rgba(228,228,231,0.4) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(228,228,231,0.4) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

  /* tab transition */
  @keyframes slideUpFade {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .tab-enter { animation: slideUpFade 120ms ease-out both; }

  @keyframes staggerIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .stagger-card { animation: staggerIn 160ms ease-out both; }

  @keyframes barGrow {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }
  .anim-bar { transform-origin: left center; animation: barGrow 420ms ease-out both; }

  @keyframes pulseDot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  .pulse-dot { animation: pulseDot 500ms ease-in-out infinite; }

  @keyframes confettiFall {
    0% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(40px) rotate(360deg); opacity: 0.6; }
  }
  .confetti-piece { animation: confettiFall 500ms ease-in infinite; }

  @keyframes drawIn {
    from { transform: scaleY(0); }
    to { transform: scaleY(1); }
  }
  .anim-bar-y { transform-origin: top; animation: drawIn 420ms ease-out both; }

  /* hide horizontal scrollbar but keep functionality */
  .hscroll { scrollbar-width: thin; }
</style>
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Pretendard,-apple-system,sans-serif;color:#475569;background:#FAFAFA">
      <div style="font-size:13px;font-weight:700;letter-spacing:.04em">MajorLink Loading...</div>
    </div>
  </div>

  <script src="vendor/react.min.js"></script>
  <script src="vendor/react-dom.min.js"></script>
  <script src="bundle.js"></script>
</body>
</html>
