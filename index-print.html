<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Campus Link — Print</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { font-family: 'Pretendard', -apple-system, sans-serif; background: #FFFFFF; color: #0F172A; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .scrollbar-hide::-webkit-scrollbar { display: none; }
  .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  .hscroll { scrollbar-width: thin; }

  /* Disable animations entirely for print stability */
  .tab-enter, .stagger-card, .anim-bar, .pulse-dot, .confetti-piece, .anim-bar-y {
    animation: none !important;
  }
  .anim-bar { transform: scaleX(1) !important; }
  .anim-bar-y { transform: scaleY(1) !important; }

  /* Each section becomes a print page */
  .page {
    width: 1400px;
    min-height: 940px;
    padding: 32px 40px 24px;
    margin: 0 auto 24px;
    background: #FFFFFF;
    page-break-after: always;
    break-after: page;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 0 1px #E4E4E7;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 14px;
    margin-bottom: 18px;
    border-bottom: 1px solid #E4E4E7;
  }
  .page-body {
    flex: 1;
    display: flex;
    align-items: stretch;
  }
  .page-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid #E4E4E7;
    font-size: 10px;
    color: #94A3B8;
    letter-spacing: 0.04em;
  }
  .device-row {
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: 24px;
    width: 100%;
  }
  .device-col { display: flex; flex-direction: column; }
  .device-col.desktop > div:last-child,
  .device-col.mobile > div:last-child { flex: 1; }
  .device-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #94A3B8;
    margin-bottom: 8px;
  }

  /* Cover page styling */
  .page.cover { padding: 80px 64px; }
  .cover-inner { max-width: 800px; }

  @page { size: 1480px 1000px; margin: 0; }

  @media print {
    body { background: #FFFFFF; margin: 0; padding: 0; }
    .page {
      width: 1480px;
      min-height: 1000px;
      margin: 0;
      box-shadow: none;
      page-break-after: always;
      break-after: page;
    }
    .page:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="vendor/react.min.js"></script>
  <script src="vendor/react-dom.min.js"></script>
  <script src="print-bundle.js"></script>
</body>
</html>
